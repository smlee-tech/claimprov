name: Publish to PyPI

# Runs when a GitHub Release is published. Uses PyPI "trusted publishing"
# (OIDC), so no API token is stored in the repo. One-time setup on PyPI:
#   pypi.org -> your account -> Publishing -> add a pending publisher:
#     project name: claimprov, owner: smlee-tech, repo: claimprov,
#     workflow: publish.yml, environment: pypi
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
